<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Jailbreak Prompts</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.8;
      margin-bottom: 3rem;
      text-align: center;
      line-height: 1.5;
    }
    h1 span {
      color: #ff3333; /* Hebt den Namen agamer hervor */
      font-weight: bold;
    }
    #exploreBtn {
      background: transparent;
      border: 1px solid #444;
      color: #ccc;
      font-family: inherit;
      font-size: 1.1rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      padding: 1rem 3rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    #exploreBtn:hover {
      border-color: #888;
      color: #fff;
    }
    #jumpscare {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: none;
      justify-content: center;
      align-items: center;
      animation: shake 0.1s infinite;
    }
    #jumpscare.active { display: flex; }
    #jumpscare img {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      filter: contrast(2) brightness(1.5) grayscale(0.5);
    }
    @keyframes shake {
      0%   { transform: translate(0, 0) scale(1); }
      25%  { transform: translate(-15px, 10px) scale(1.05); }
      50%  { transform: translate(12px, -15px) scale(1.1); }
      75%  { transform: translate(-10px, -8px) scale(1.05); }
      100% { transform: translate(15px, 12px) scale(1); }
    }
  </style>
</head>
<body>

  <h1>Explore Jailbreak Prompts<br>from <span>agamer</span></h1>
  <button id="exploreBtn">Explore</button>

  <!-- Jumpscare-Ebene -->
  <div id="jumpscare">
    <!-- Ein stabiler Link zu einem gruseligen Bild (Wikimedia) -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0a/The_Halloween_Tree_%284013073281%29.jpg/1024px-The_Halloween_Tree_%284013073281%29.jpg" alt="Jumpscare">
  </div>

  <!-- Audio-Element: Stabiler Link zu einem lauten Schrei -->
  <audio id="scareAudio" preload="auto">
    <source src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Wilhelm_Scream.ogg" type="audio/ogg">
  </audio>

  <script>
    (function() {
      const btn = document.getElementById('exploreBtn');
      const scare = document.getElementById('jumpscare');
      const audio = document.getElementById('scareAudio');
      let fired = false;

      btn.addEventListener('click', function() {
        if (fired) return;
        fired = true;

        // Audio abspielen
        audio.volume = 1.0;
        audio.currentTime = 0;
        audio.play().catch(function(e) {
          console.warn('Audio blocked:', e);
        });

        // Jumpscare anzeigen
        scare.classList.add('active');
        
        // Verhindert, dass man zurückscrollt, während der Schock läuft
        document.body.style.overflow = 'hidden';
      });
    })();
  </script>

</body>
</html>
