<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Resources Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            font-family: 'Courier New', monospace;
            color: #00ff00;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.1;
        }

        .container {
            text-align: center;
            z-index: 10;
            position: relative;
        }

        h1 {
            font-size: 3rem;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
            margin-bottom: 2rem;
            animation: pulse 2s infinite;
            letter-spacing: 3px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .subtitle {
            color: #888;
            margin-bottom: 3rem;
            font-size: 1.2rem;
        }

        .explore-btn {
            background: transparent;
            border: 2px solid #ff0000;
            color: #ff0000;
            padding: 20px 60px;
            font-size: 1.5rem;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: bold;
        }

        .explore-btn:hover {
            background: #ff0000;
            color: #000;
            box-shadow: 0 0 30px #ff0000, 0 0 60px #ff0000;
            transform: scale(1.05);
        }

        .explore-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 0, 0, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .explore-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .jumpscare {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .jumpscare.active {
            display: flex;
            animation: shake 0.1s infinite;
        }

        .scare-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: scream 0.5s infinite alternate;
        }

        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-10px, 10px) rotate(-5deg); }
            50% { transform: translate(10px, -10px) rotate(5deg); }
            75% { transform: translate(-10px, -10px) rotate(-5deg); }
            100% { transform: translate(10px, 10px) rotate(5deg); }
        }

        @keyframes scream {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.3); filter: brightness(1.5) contrast(1.5); }
        }

        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.3);
            z-index: 10000;
            display: none;
            pointer-events: none;
            animation: flash 0.1s infinite;
        }

        .flash-overlay.active {
            display: block;
        }

        @keyframes flash {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        .loading-text {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff0000;
            font-size: 1.5rem;
            display: none;
            z-index: 10001;
        }

        .loading-text.active {
            display: block;
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <canvas class="matrix-bg" id="matrix"></canvas>
    
    <div class="container">
        <h1>EXPLORE JAILBREAK PROMPTS</h1>
        <p class="subtitle">// from a gamer //</p>
        <button class="explore-btn" onclick="initiateJumpscare()">Explore</button>
    </div>

    <div class="jumpscare" id="jumpscare" onclick="closeJumpscare()">
        <img src="assets/logo_v2.png" alt="Logo" class="scare-image" id="scareImg">
    </div>
    
    <div class="flash-overlay" id="flash"></div>
    <div class="loading-text" id="loading">ACCESSING RESTRICTED DATABASE...</div>

    <audio id="screamAudio" preload="auto">
        <source src="assets/ambient_sound.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノ';
        const charArray = chars.split('');
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        
        const drops = [];
        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }
        
        function drawMatrix() {
            ctx.fillStyle = 'rgba(10, 10, 15, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';
            
            for (let i = 0; i < drops.length; i++) {
                const text = charArray[Math.floor(Math.random() * charArray.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        
        setInterval(drawMatrix, 50);

        function initiateJumpscare() {
            const jumpscare = document.getElementById('jumpscare');
            const flash = document.getElementById('flash');
            const loading = document.getElementById('loading');
            const audio = document.getElementById('screamAudio');
            
            loading.classList.add('active');
            
            setTimeout(() => {
                loading.classList.remove('active');
                jumpscare.classList.add('active');
                flash.classList.add('active');
                
                audio.volume = 1.0;
                audio.play().catch(e => {
                    console.log('Audio blocked, visual only');
                });
                
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                }
                
                if (navigator.vibrate) {
                    navigator.vibrate([500, 100, 500, 100, 1000]);
                }
                
            }, 2000);
        }
        
        function closeJumpscare() {
            const jumpscare = document.getElementById('jumpscare');
            const flash = document.getElementById('flash');
            const audio = document.getElementById('screamAudio');
            
            jumpscare.classList.remove('active');
            flash.classList.remove('active');
            audio.pause();
            audio.currentTime = 0;
            
            if (document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            }
        }
        
        document.addEventListener('contextmenu', e => e.preventDefault());
        
        document.addEventListener('keydown', e => {
            if (e.key === 'F11') {
                e.preventDefault();
                initiateJumpscare();
            }
        });
    </script>
</body>
</html>
