<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 {
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.6;
      margin-bottom: 3rem;
    }
    #exploreBtn {
      background: transparent;
      border: 1px solid #444;
      color: #ccc;
      font-family: inherit;
      font-size: 1.1rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      padding: 1rem 3rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    #exploreBtn:hover {
      border-color: #888;
      color: #fff;
    }
    #jumpscare {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: none;
      justify-content: center;
      align-items: center;
      animation: shake 0.15s infinite;
    }
    #jumpscare.active { display: flex; }
    #jumpscare img {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      filter: contrast(1.5) brightness(1.2);
    }
    @keyframes shake {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(-12px, 8px); }
      50%  { transform: translate(10px, -10px); }
      75%  { transform: translate(-8px, -6px); }
      100% { transform: translate(12px, 10px); }
    }
  </style>
</head>
<body>

  <h1>Explore</h1>
  <button id="exploreBtn">Explore</button>

  <div id="jumpscare">
    <img src="https://cdn.pixabay.com/photo/2025/09/26/07/03/halloween-9853016_1280.jpg" alt="">
  </div>

  <audio id="scareAudio" preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2024/10/28/audio_9e5a3b7f1c.mp3?filename=jumpscare-sound-effect-256050.mp3" type="audio/mpeg">
  </audio>

  <script>
    (function() {
      const btn = document.getElementById('exploreBtn');
      const scare = document.getElementById('jumpscare');
      const audio = document.getElementById('scareAudio');
      let fired = false;

      btn.addEventListener('click', function() {
        if (fired) return;
        fired = true;

        audio.volume = 1.0;
        audio.currentTime = 0;
        audio.play().catch(function(e) {
          console.warn('Audio blocked:', e);
        });

        scare.classList.add('active');
      });
    })();
  </script>

</body>
</html>
